
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px #0001;
            max-width: 380px;
        }

        .check {
            font-size: 65px;
            color: #16a34a;
        }

        h1 {
            color: #16a34a;
        }

        p {
            color: #64748b;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="check">✓</div>

        <h1>Payment Successful!</h1>

        <p>Your payment has been completed successfully.</p>

        <p>Thank you for your purchase!</p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
